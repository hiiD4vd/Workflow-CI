name: CI Workflow MLOps

on:
  push:
    paths:
      - 'MLProject/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn imbalanced-learn

      - name: Run MLProject (Train Model)
        id: ml-run
        run: |
          cd MLProject
          mlflow run . --env-manager=local
          RUN_ID=$(cat run_id.txt)
          echo "run_id=$RUN_ID" >> $GITHUB_ENV
          echo "Run ID: $RUN_ID"

      - name: Save Model Artifacts to GitHub (Kriteria Skilled)
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: MLProject/mlruns/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image manually (Kriteria Advance)
        run: |
          cd MLProject
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sml-fraud-model:latest .

      - name: Push Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/sml-fraud-model:latest
